<script>
/* Data + sign-in layer.
   - Domestic (Ranji, SMAT...) data: data.json in this repo (read-only, updated nightly).
   - Local club cricket: Firebase Firestore (live). Fans read without login; approved scorers sign in with Google. */
(function(){
  const CFG=window.FIREBASE_CONFIG;
  const FB=!!(CFG&&CFG.apiKey&&window.firebase);
  let fs=null,auth=null;
  if(FB){try{firebase.initializeApp(CFG);fs=firebase.firestore();auth=firebase.auth();}catch(e){console.error(e);}}
  let cache=null;
  const load=()=>cache||(cache=fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}));
  const LOCAL={teams:"localTeams",matches:"localMatches"};
  const localIds={teams:new Set(),matches:new Set()};
  const mk=(id,v)=>({id,exists:true,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});
  const db={
    collection:name=>({onSnapshot:(next,err)=>{
      let base=null,loc={};
      const emit=()=>{if(base===null)return;const docs=Object.entries(base[name]||{}).map(([id,v])=>mk(id,v));
        for(const [id,v] of Object.entries(loc))docs.push(mk(id,v));next({docs,metadata:{fromCache:false,hasPendingWrites:false}});};
      load().then(d=>{base=d;emit();}).catch(e=>err&&err({code:"unavailable",message:String(e)}));
      if(fs&&LOCAL[name]){fs.collection(LOCAL[name]).onSnapshot(q=>{loc={};localIds[name].clear();
        q.forEach(d=>{const v=Object.assign({},d.data(),{local:true});loc[d.id]=v;localIds[name].add(d.id);});emit();},e=>console.warn("local data",e));}
      return()=>{};}}),
    doc:path=>{const [col,id]=path.split("/");return{
      set:async data=>{if(!fs||!LOCAL[col])return;if(window.AUTH&&!auth.currentUser)await window.AUTH.ensure();if(!data.local&&!localIds[col].has(id))return;const v=JSON.parse(JSON.stringify(data));v.local=true;await fs.collection(LOCAL[col]).doc(id).set(v);},
      delete:async()=>{if(!fs||!LOCAL[col]||!localIds[col].has(id))return;await fs.collection(LOCAL[col]).doc(id).delete();}};}
  };
  window.claude={use:async n=>n==="db"?db:n==="user"?{canEdit:async()=>false}:null};

  const A=window.AUTH={enabled:FB&&!!auth,ready:!(FB&&auth),uid:null,name:"",email:"",isAnon:true,canScore:false,isAdmin:false,
    _l:[],onChange(f){this._l.push(f);},_emit(){this._l.forEach(f=>{try{f();}catch(e){console.error(e);}});}};
  if(A.enabled){
    auth.getRedirectResult().catch(()=>{});
    auth.onAuthStateChanged(async u=>{
      A.uid=u?u.uid:null;A.isAnon=!u||u.isAnonymous;A.name=u&&!u.isAnonymous?(u.displayName||u.email||""):"";A.email=u&&!u.isAnonymous?(u.email||""):"";
      A.isAdmin=false;A.canScore=!!u;
      if(u&&!u.isAnonymous){try{await fs.collection("meta").doc("admin").get();A.isAdmin=true;}catch(e){A.isAdmin=false;}}
      A.ready=true;A._emit();
    });
  }
  /* Scorers need no login: the first time they start a match, this device gets a silent anonymous ID.
     Only that device (or the admin) can change that match. */
  A.ensure=async()=>{if(!A.enabled)throw new Error("off");if(auth.currentUser){A.uid=auth.currentUser.uid;return;}
    const c=await auth.signInAnonymously();A.uid=c.user.uid;A.canScore=true;};
  A.signIn=async()=>{const p=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(p);}catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))await auth.signInWithRedirect(p);else throw e;}};
  A.signOut=()=>auth.signOut();
})();
</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const N=v=>{const n=Number(v);return Number.isFinite(n)&&n>=0?Math.floor(n):0};
const ov=l=>l%6?`${Math.floor(l/6)}.${l%6}`:`${l/6}`;
const fmt=(v,d=2)=>v==null||!isFinite(v)?"–":v.toFixed(d);
const ftime=iso=>{if(!iso)return"";const x=new Date(iso);return isNaN(x)?"":x.toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})};
const fdate=d=>{if(!d)return"";const x=new Date(d+"T00:00:00");return isNaN(x)?esc(d):x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})};

/* Indian domestic seasons run July-June, e.g. Oct 2026-Mar 2027 = "2026-27". */
function seasonOf(d){if(!d)return"";const y=+String(d).slice(0,4),mo=+String(d).slice(5,7)||1;const a=mo>=7?y:y-1;return a+"-"+String((a+1)%100).padStart(2,"0");}
const CUR_SEASON=seasonOf(new Date().toISOString().slice(0,10));
const S={teams:{},matches:{},players:{},canEdit:false,db:null,loaded:{teams:false,matches:false},err:"",mTab:"live",lbF:{t:"",s:CUR_SEASON}};
const DIS=["Srinagar","Jammu","Anantnag","Baramulla","Budgam","Pulwama","Kupwara","Bandipora","Ganderbal","Kulgam","Shopian","Kathua","Udhampur","Rajouri","Poonch","Doda","Kishtwar","Ramban","Reasi","Samba"];
const TOURS=[
 {n:"Ranji Trophy",f:"First-class",o:90,i:"🏆",d:"India's premier first-class championship"},
 {n:"Vijay Hazare Trophy",f:"One-day · 50 overs",o:50,i:"🏏",d:"National one-day championship"},
 {n:"Syed Mushtaq Ali Trophy",f:"T20 · 20 overs",o:20,i:"⚡",d:"National T20 championship"},
 {n:"Irani Cup",f:"First-class",o:90,i:"🥇",d:"Ranji champions vs Rest of India"},
 {n:"Duleep Trophy",f:"First-class",o:90,i:"🗺️",d:"Zonal first-class tournament"},
 {n:"CK Nayudu Trophy",f:"Under-23",o:90,i:"🎓",d:"U-23 multi-day championship"},
 {n:"Cooch Behar Trophy",f:"Under-19",o:90,i:"🌱",d:"U-19 multi-day championship"},
 {n:"Vinoo Mankad Trophy",f:"Under-19 · 50 overs",o:50,i:"🌱",d:"U-19 one-day championship"},
 {n:"Vijay Merchant Trophy",f:"Under-16",o:90,i:"🧒",d:"U-16 multi-day championship"},
 {n:"Senior Women's One Day Trophy",f:"Women · 50 overs",o:50,i:"👩",d:"Women's national one-day"},
 {n:"Senior Women's T20 Trophy",f:"Women · 20 overs",o:20,i:"👩",d:"Women's national T20"},
 {n:"Women's U23 T20 Trophy",f:"Women U-23 · 20 overs",o:20,i:"👩",d:"Women's U-23 national T20"},
 {n:"Women's U19 T20 Trophy",f:"Women U-19 · 20 overs",o:20,i:"👩",d:"Women's U-19 national T20"},
 {n:"JKCA League",f:"Local",o:20,i:"🏔️",d:"J&K Cricket Association local cricket"},
];
const jkSq=m=>{const q=m&&m.squad;if(!q)return [];return q["t-jk"]||Object.values(q)[0]||[];};
const slug=n=>String(n||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"friendly";
function allTours(){const names=new Set(TOURS.map(t=>t.n));for(const m of Object.values(S.matches))if(m.tournament&&!m.local)names.add(m.tournament);
  return [...names].map(n=>TOURS.find(t=>t.n===n)||{n,f:"Other",o:20,i:"🏏",d:"Custom tournament",custom:true});}
const WK=["bowled","caught","lbw","run out","stumped","hit wicket"];

/* ---------- helpers ---------- */
function rebuildPlayers(){S.players={};for(const t of Object.values(S.teams))for(const p of (t.players||[]))S.players[p.id]={...p,teamId:t.id,team:t.name};}
const pn=id=>id&&S.players[id]?S.players[id].name:(id?"Unknown":"—");
const tn=id=>S.teams[id]?S.teams[id].name:"Team";
const tsn=id=>S.teams[id]?(S.teams[id].short||S.teams[id].name):"TBD";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2200);}
const chains={};
function persist(path,obj){
  if(!S.db){toast("Not connected");return Promise.resolve();}
  const data=JSON.parse(JSON.stringify(obj));delete data.id;
  chains[path]=(chains[path]||Promise.resolve()).then(()=>S.db.doc(path).set(data)).catch(e=>{
    toast(e&&e.code==="quota_exceeded"?"Storage full: delete old matches":"Couldn't save, only editors can change data");
  });
  return chains[path];
}
function removeDoc(path){return S.db?S.db.doc(path).delete().catch(()=>toast("Couldn't delete")):Promise.resolve();}

/* ---------- cricket engine ---------- */
function desc(b){
  const bw=pn(b.bow),f=pn(b.f);
  switch(b.wk){case"bowled":return`b ${bw}`;case"caught":return b.f===b.bow?`c & b ${bw}`:`c ${f} b ${bw}`;case"lbw":return`lbw b ${bw}`;
    case"run out":return`run out${b.f?` (${f})`:""}`;case"stumped":return`st ${f} b ${bw}`;case"hit wicket":return`hit wicket b ${bw}`;default:return b.wk;}
}
function calcCard(cd){
  const r={runs:N(cd.total),wkts:N(cd.wkts),legal:N(cd.balls),bat:{},order:[],bowl:{},bowlOrder:[],ext:{wd:0,nb:0,b:0,lb:0},fow:[],overs:[],cur:[],card:true};
  for(const x of (cd.bt||[])){if(!x.p||r.bat[x.p])continue;r.bat[x.p]={r:N(x.r),b:N(x.b),f:N(x.f),s:N(x.s),out:x.out||null};r.order.push(x.p);}
  for(const x of (cd.bw||[])){if(!x.p||r.bowl[x.p])continue;const unk=x.balls==null;r.bowl[x.p]={balls:unk?0:N(x.balls),r:unk?0:N(x.r),rk:x.r!=null?N(x.r):null,w:N(x.w),wd:0,nb:0,m:N(x.m),unk};r.bowlOrder.push(x.p);}
  return r;
}
function calc(inn){
  if(inn.card)return calcCard(inn.card);
  const r={runs:0,wkts:0,legal:0,bat:{},order:[],bowl:{},bowlOrder:[],ext:{wd:0,nb:0,b:0,lb:0},fow:[],overs:[],cur:[]};
  const aB=id=>{if(id&&!r.bat[id]){r.bat[id]={r:0,b:0,f:0,s:0,out:null};r.order.push(id);}};
  const aW=id=>{if(id&&!r.bowl[id]){r.bowl[id]={balls:0,r:0,w:0,wd:0,nb:0,m:0};r.bowlOrder.push(id);}};
  let oR=0,oL=0,cur=[];
  for(const b of (inn.balls||[])){
    aB(b.bat);aB(b.ns);aW(b.bow);
    const bt=r.bat[b.bat],bw=r.bowl[b.bow];const runs=b.runs||0,exr=b.exr||0;
    const legal=b.ex!=="wd"&&b.ex!=="nb";
    r.runs+=runs+exr;
    if(bt){if(b.ex!=="wd")bt.b++;bt.r+=runs;if(b.ex!=="b"&&b.ex!=="lb"){if(runs===4)bt.f++;if(runs===6)bt.s++;}}
    const con=runs+((b.ex==="wd"||b.ex==="nb")?exr:0);
    if(bw){bw.r+=con;if(b.ex==="wd")bw.wd+=exr;if(b.ex==="nb")bw.nb+=exr;if(legal)bw.balls++;}
    oR+=con;
    if(b.ex)r.ext[b.ex]+=exr;
    if(legal){r.legal++;oL++;}
    cur.push(b);
    if(b.wk){r.wkts++;aB(b.out);r.bat[b.out].out=desc(b);if(b.wk!=="run out"&&bw)bw.w++;r.fow.push({id:b.out,score:r.runs,wk:r.wkts,ov:ov(r.legal)});}
    if(legal&&oL===6){if(oR===0&&bw)bw.m++;r.overs.push(cur);cur=[];oL=0;oR=0;}
  }
  r.cur=cur;
  aB(inn.striker);aB(inn.nonStriker);aW(inn.bowler);
  return r;
}
function ballLabel(b){
  if(b.wk)return{t:"W"+(b.runs?"+"+b.runs:""),c:"w"};
  if(b.ex==="wd")return{t:(b.exr>1?(b.exr-1):"")+"wd",c:"x"};
  if(b.ex==="nb")return{t:"nb"+(b.runs?"+"+b.runs:""),c:"x"};
  if(b.ex==="b"||b.ex==="lb")return{t:b.exr+b.ex,c:"x"};
  return{t:String(b.runs||0),c:b.runs===4?"b4":b.runs===6?"b6":""};
}
const chip=b=>{const l=ballLabel(b);return`<span class="ball ${l.c}">${esc(l.t)}</span>`};
function xiOf(m,team){return (m.xi&&m.xi[team])||[];}
function maxWk(m,inn){return Math.max(1,xiOf(m,inn.bat).length-1);}
function target(m){return m.innings&&m.innings.length>1?calc(m.innings[0]).runs+1:null;}
function innLine(m,inn){const c=calc(inn);const cd=inn.card;return`${c.runs}${cd&&c.wkts>=10?"":"/"+c.wkts}${cd&&cd.dec?"d":""}${cd&&cd.fo?" (f/o)":""}${cd&&cd.balls==null?"":` <span class="muted small">(${ov(c.legal)}${m.overs?"/"+m.overs:""} ov)</span>`}`;}
function teamScore(m,team){const ins=(m.innings||[]).filter(i=>i.bat===team);return ins.length?ins.map(i=>innLine(m,i)).join(" &amp; "):`<span class="muted small">${m.status==="done"?"DNB":"Yet to bat"}</span>`;}
function computeResult(m){
  const [a,b]=m.innings;const ca=calc(a),cb=b?calc(b):null;
  if(!cb)return`${tn(a.bat)} ${ca.runs}/${ca.wkts}, match ended`;
  if(cb.runs>ca.runs)return`${tn(b.bat)} won by ${maxWk(m,b)-cb.wkts} wicket${maxWk(m,b)-cb.wkts===1?"":"s"}`;
  if(cb.runs===ca.runs)return"Match tied";
  return`${tn(a.bat)} won by ${ca.runs-cb.runs} run${ca.runs-cb.runs===1?"":"s"}`;
}
function innDone(m,inn,idx){
  const c=calc(inn);
  if(c.wkts>=maxWk(m,inn))return true;
  if(m.overs&&c.legal>=m.overs*6)return true;
  if(idx===1&&c.runs>=target(m))return true;
  return false;
}

/* ---------- scoring actions ---------- */
function curInn(m){return m.innings[m.innings.length-1];}
function addBall(m,b){
  m=S.matches[m.id]||m;
  const inn=curInn(m);if(inn.closed||!inn.striker||!inn.nonStriker||!inn.bowler)return;
  const ball={runs:N(b.runs),ex:b.ex||"",exr:N(b.exr),bat:inn.striker,ns:inn.nonStriker,bow:inn.bowler};
  if(b.wk){ball.wk=b.wk;ball.out=b.out;if(b.f)ball.f=b.f;}
  inn.balls.push(ball);
  let ran=ball.ex==="wd"?ball.exr-1:(ball.ex==="b"||ball.ex==="lb")?ball.exr:ball.runs;
  let s=inn.striker,n=inn.nonStriker;
  if(ran%2===1)[s,n]=[n,s];
  if(ball.wk){if(ball.out===s)s=null;else if(ball.out===n)n=null;}
  const c=calc(inn);const legal=ball.ex!=="wd"&&ball.ex!=="nb";
  if(legal&&c.legal%6===0){[s,n]=[n,s];inn.lastBowler=inn.bowler;inn.bowler=null;}
  inn.striker=s;inn.nonStriker=n;
  const idx=m.innings.length-1;
  if(innDone(m,inn,idx)){inn.closed=true;if(idx===1){m.status="done";m.result=computeResult(m);}}
  persist("matches/"+m.id,m);render();
}
function undo(m){
  m=S.matches[m.id]||m;
  let inn=curInn(m);
  if(!inn.balls.length){
    if(m.innings.length>1){m.innings.pop();m.status="live";m.result="";persist("matches/"+m.id,m);render();}
    return;
  }
  const b=inn.balls.pop();
  inn.striker=b.bat;inn.nonStriker=b.ns;inn.bowler=b.bow;inn.closed=false;m.status="live";m.result="";
  const c=calc(inn);
  inn.lastBowler=c.overs.length?c.overs[c.overs.length-1][0].bow:null;
  persist("matches/"+m.id,m);render();
}
function startSecond(m){
  m=S.matches[m.id]||m;
  const a=m.innings[0];a.closed=true;
  m.innings.push({bat:a.bowl,bowl:a.bat,balls:[],striker:null,nonStriker:null,bowler:null,closed:false});
  persist("matches/"+m.id,m);render();
}
function endMatch(m,text){m=S.matches[m.id]||m;m.status="done";m.nr=!!text;const i=curInn(m);i.closed=true;m.result=text||computeResult(m);persist("matches/"+m.id,m);render();}

/* ---------- stats ---------- */
function matchFilter(f){return Object.values(S.matches).filter(m=>(f.local?m.local:!m.local)&&(!f.d||(S.teams[m.teamA]||{}).district===f.d||(S.teams[m.teamB]||{}).district===f.d)&&(!f.t||m.tournament===f.t)&&(!f.s||seasonOf(m.date)===f.s)&&(!f.mo||(m.date||"").slice(0,7)===f.mo));}
function stats(f={}){
  const P={};const g=id=>P[id]||(P[id]={id,ct:0,m:0,inn:0,no:0,r:0,b:0,f:0,s:0,hs:0,hsNo:false,c50:0,c100:0,bb:0,br:0,w:0,bw:-1,bwr:0,log:[]});
  for(const m of matchFilter(f)){
    for(const t of Object.keys(m.xi||{}))for(const id of m.xi[t])g(id).m++;
    for(const inn of (m.innings||[])){
      const c=calc(inn);
      for(const id of c.order){const x=c.bat[id];const p=g(id);
        if(!inn.card&&x.b===0&&!x.out&&!(inn.balls||[]).some(b=>b.bat===id||b.ns===id))continue;
        p.inn++;if(!x.out)p.no++;p.r+=x.r;p.b+=x.b;p.f+=x.f;p.s+=x.s;
        if(x.r>p.hs||(x.r===p.hs&&!x.out)){p.hs=x.r;p.hsNo=!x.out;}
        if(x.r>=100)p.c100++;else if(x.r>=50)p.c50++;
        p.log.push({m,type:"bat",r:x.r,b:x.b,no:!x.out});}
      for(const id of c.bowlOrder){const x=c.bowl[id];if(!x.balls&&!x.r&&!x.wd&&!x.w)continue;const p=g(id);
        p.w+=x.w;
        if(!x.unk){p.bb+=x.balls;p.br+=x.r;if(x.w>p.bw||(x.w===p.bw&&x.r<p.bwr)){p.bw=x.w;p.bwr=x.r;}}
        p.log.push({m,type:"bowl",w:x.w,r:x.r,balls:x.balls,unk:x.unk});}
      for(const b of (inn.balls||[]))if((b.wk==="caught"||b.wk==="stumped")&&b.f)g(b.f).ct++;
    }
  }
  for(const p of Object.values(P)){p.avg=p.inn-p.no>0?p.r/(p.inn-p.no):null;p.sr=p.b?p.r*100/p.b:null;p.eco=p.bb?p.br*6/p.bb:null;p.bavg=p.w?p.br/p.w:null;}
  return P;
}

function matchCard(m){
  const live=m.status==="live",up=m.status==="upcoming";
  let sub="";
  if(up)sub=`<div class="small" style="margin-top:6px">🕒 ${esc(ftime(m.start)||fdate(m.date))}${m.venue?` · ${esc(m.venue)}`:""}</div>`;
  else if(live&&m.innings&&m.innings.length===2&&!curInn(m).closed){const c=calc(curInn(m));const need=target(m)-c.runs;const left=m.overs*6-c.legal;sub=`<div class="small" style="margin-top:6px">${esc(tsn(curInn(m).bat))} need <b>${need}</b> from ${left} ball${left===1?"":"s"}</div>`;}
  else if(m.result)sub=`<div class="small res" style="margin-top:6px">${esc(m.result)}</div>`;
  else if(live&&m.toss)sub=`<div class="small muted" style="margin-top:6px">${esc(tsn(m.toss.w))} won the toss, chose to ${esc(m.toss.d)}</div>`;
  return`<div class="card mc" data-go="match-${esc(m.id)}" style="margin:0">
   <div class="row sp"><span class="small muted"><span class="tag ${m.local?"loc":"dom"}" style="margin-right:6px">${m.local?"Local club":"Domestic"}</span>${esc(m.tournament||"Friendly")} · ${fdate(m.date)}</span>${live?'<span class="tag live">Live</span>':up?'<span class="tag">Upcoming</span>':'<span class="tag">Result</span>'}</div>
   ${up?`<div class="tline" style="margin-top:8px"><b>${esc(tn(m.teamA))}</b><span class="muted small">vs</span><b>${esc(tn(m.teamB))}</b></div>`:`<div class="tline" style="margin-top:8px"><b>${esc(tn(m.teamA))}</b><span class="score">${teamScore(m,m.teamA)}</span></div>
   <div class="tline"><b>${esc(tn(m.teamB))}</b><span class="score">${teamScore(m,m.teamB)}</span></div>`}${sub}</div>`;
}

/* ----- player of the match + PDF report ----- */
function matchPOTM(m){
  const P={};const g=id=>P[id]||(P[id]={id,r:0,b:0,bat:false,no:false,w:0,rc:0,bb:0,ct:0});
  for(const inn of (m.innings||[])){const c=calc(inn);
    for(const id of c.order){const x=c.bat[id];if(!x.b&&!x.out&&!(inn.balls||[]).some(b=>b.bat===id||b.ns===id))continue;const p=g(id);p.r+=x.r;p.b+=x.b;p.bat=true;p.no=!x.out;}
    for(const id of c.bowlOrder){const x=c.bowl[id];if(!x.balls&&!x.w)continue;const p=g(id);p.w+=x.w;p.rc+=x.r;p.bb+=x.balls;}
    for(const b of (inn.balls||[]))if((b.wk==="caught"||b.wk==="stumped")&&b.f)g(b.f).ct++;}
  const o=outcome(m);const win=o&&o.type==="win"?o.w:null;
  const teamOf=id=>{for(const t of Object.keys(m.xi||{}))if((m.xi[t]||[]).includes(id))return t;return null;};
  const list=Object.values(P).map(p=>({...p,team:teamOf(p.id),pts:p.r+p.w*20+p.ct*10+(win&&teamOf(p.id)===win?5:0)})).sort((a,b)=>b.pts-a.pts||b.r-a.r||b.w-a.w);
  return list[0]&&list[0].pts>0?list[0]:null;
}
function potmLine(p){const parts=[];if(p.bat)parts.push(`${p.r}${p.no?"*":""} (${p.b})`);if(p.bb||p.w)parts.push(`${p.w}/${p.rc} (${ov(p.bb)} ov)`);if(p.ct)parts.push(`${p.ct} catch${p.ct===1?"":"es"}`);return parts.join(" · ");}
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement("script");el.src=src;el.onload=res;el.onerror=()=>rej(new Error("load "+src));document.head.appendChild(el);});}

}

  ${m.local?`<div class="row" style="margin-bottom:12px"><button class="btn g" id="pdf">⬇ Download match report (PDF)</button></div>`:""}

function scorecard(m,inn,k){
  const c=calc(inn);const ex=c.ext;const extras=ex.wd+ex.nb+ex.b+ex.lb;

  ${cd&&cd.partial?`<div class="note" style="margin-top:10px">Partial scorecard: only the figures published in match reports are shown.${cd.note?" "+esc(cd.note):""}</div>`:""}
  ${cd&&!c.order.length?"":`
  <div class="scroll" style="margin-top:10px"><table><thead><tr><th class="l">Batter</th><th class="l"></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>
  ${c.order.map(id=>{const x=c.bat[id];const atC=!x.out&&(id===inn.striker||id===inn.nonStriker)&&!inn.closed;return`<tr><td class="l"><span class="link" data-p="${esc(id)}" style="font-weight:600">${esc(pn(id))}</span>${atC&&id===inn.striker?" *":""}</td><td class="l small muted">${x.out?esc(x.out):atC?"batting":"not out"}</td><td><b>${x.r}</b></td><td>${x.b}</td><td>${x.f}</td><td>${x.s}</td><td>${fmt(x.b?x.r*100/x.b:null,1)}</td></tr>`}).join("")}
  </tbody></table></div>`}
  ${cd?(cd.extras!=null?`<div class="small" style="margin-top:8px"><b>Extras ${cd.extras}</b>${cd.extrasDetail?` <span class="muted">(${esc(cd.extrasDetail)})</span>`:""}</div>`:""):`<div class="small" style="margin-top:8px"><b>Extras ${extras}</b> <span class="muted">(wd ${ex.wd}, nb ${ex.nb}, b ${ex.b}, lb ${ex.lb})</span></div>`}
  ${yet.length?`<div class="small muted" style="margin-top:6px">Yet to bat: ${yet.map(id=>esc(pn(id))).join(", ")}</div>`:""}
  ${c.fow.length?`<div class="small muted" style="margin-top:6px">Fall of wickets: ${c.fow.map(f=>`${f.score}-${f.wk} (${esc(pn(f.id))}, ${f.ov})`).join(", ")}</div>`:""}
  <div class="scroll" style="margin-top:12px"><table><thead><tr><th class="l">Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th><th>Wd</th><th>Nb</th></tr></thead><tbody>
  ${c.bowlOrder.filter(id=>c.bowl[id].balls||c.bowl[id].r||c.bowl[id].w).map(id=>{const x=c.bowl[id];return x.unk?`<tr><td class="l"><span class="link" data-p="${esc(id)}" style="font-weight:600">${esc(pn(id))}</span></td><td>–</td><td>–</td><td>${x.rk!=null?x.rk:"–"}</td><td><b>${x.w}</b></td><td>–</td><td>–</td><td>–</td></tr>`:`<tr><td class="l"><span class="link" data-p="${esc(id)}" style="font-weight:600">${esc(pn(id))}</span></td><td>${ov(x.balls)}</td><td>${x.m}</td><td>${x.r}</td><td><b>${x.w}</b></td><td>${fmt(x.balls?x.r*6/x.balls:null)}</td><td>${cd?"–":x.wd}</td><td>${cd?"–":x.nb}</td></tr>`}).join("")||`<tr><td class="l muted" colspan="8">${cd?"Bowling figures not available":"No overs bowled"}</td></tr>`}
  </tbody></table></div></div>`;
}
function crease(m,inn,c){
  const bat=[inn.striker,inn.nonStriker].filter(Boolean);

   ${bat.map(id=>{const x=c.bat[id]||{r:0,b:0,f:0,s:0};return`<tr><td class="l"><b>${esc(pn(id))}${id===inn.striker?" *":""}</b></td><td><b>${x.r}</b></td><td>${x.b}</td><td>${x.f}</td><td>${x.s}</td><td>${fmt(x.b?x.r*100/x.b:null,1)}</td></tr>`}).join("")||'<tr><td class="l muted" colspan="6">—</td></tr>'}

function liveHead(m,inn,c){

function liveView(m){
  const inn=curInn(m);const c=calc(inn);

  return`<div class="card">${liveHead(m,inn,c)}<div style="margin-top:12px">${crease(m,inn,c)}</div></div>

function scorer(m){
  const inn=curInn(m);const c=calc(inn);const idx=m.innings.length-1;
  if(inn.closed){
    if(idx===0)return`<div class="card">${liveHead(m,inn,c)}<div class="note" style="margin-top:14px">Innings complete. <b>${esc(tn(inn.bowl))}</b> need <b>${c.runs+1}</b> to win${m.overs?` from ${m.overs} overs`:""}.</div>
      <div class="row" style="margin-top:14px"><button class="btn" id="s2">Start 2nd innings</button><button class="btn g" id="un">Undo last ball</button></div></div>`;
    return"";
  }
  const outIds=new Set(Object.entries(c.bat).filter(([,x])=>x.out).map(([id])=>id));
  const avail=xiOf(m,inn.bat).filter(id=>!outIds.has(id)&&id!==inn.striker&&id!==inn.nonStriker);
  const bowlers=xiOf(m,inn.bowl).filter(id=>id!==inn.lastBowler);
  const need=[];
  const sel=(n,label,ids)=>`<div><label>${label}</label><select name="${n}"><option value="">Select…</option>${ids.map(id=>`<option value="${esc(id)}">${esc(pn(id))}</option>`).join("")}</select></div>`;
  if(!inn.striker)need.push(sel("striker",inn.balls.length?"New batter (on strike)":"Striker",avail));
  if(!inn.nonStriker)need.push(sel("nonStriker",inn.balls.length?"New batter (non-striker)":"Non-striker",avail));
  if(!inn.bowler)need.push(sel("bowler",inn.balls.length?"Next over bowler":"Opening bowler",bowlers));
  const ready=!need.length;
  return`<div class="card">${liveHead(m,inn,c)}<div style="margin-top:12px">${crease(m,inn,c)}</div></div>
  ${need.length?`<div class="card"><form id="selF"><div class="fgrid">${need.join("")}</div><div class="row" style="margin-top:12px"><button class="btn">Confirm</button>${inn.balls.length?'<button type="button" class="btn g" id="un2">Undo last ball</button>':""}</div></form></div>`:""}
  <div class="card"><div class="pad" id="pad">
   ${[0,1,2,3,4,6].map(r=>`<button data-r="${r}" ${ready?"":"disabled"}>${r}</button>`).join("")}
   <button class="x" data-e="wd" ${ready?"":"disabled"}>Wide</button><button class="x" data-e="nb" ${ready?"":"disabled"}>No ball</button>
   <button class="x" data-e="b" ${ready?"":"disabled"}>Bye</button><button class="x" data-e="lb" ${ready?"":"disabled"}>Leg bye</button>
   <button class="w" data-wk="1" ${ready?"":"disabled"}>OUT</button><button class="u" data-un="1" ${inn.balls.length||idx>0?"":"disabled"}>↶ Undo</button>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn g sm" id="swap" ${inn.striker&&inn.nonStriker?"":"disabled"}>⇄ Swap strike</button><button class="btn g sm" id="eoi">End innings</button><span class="small muted">Share this page so fans can follow live.</span></div></div>`;
}
function bindScorer(m0){

    const E=sf.elements;if(E.striker&&!st||E.nonStriker&&!ns||E.bowler&&!bw){toast("Pick all players");return;}
    if(st&&ns&&st===ns){toast("Pick two different batters");return;}
    const M=fresh(),inn=curInn(M);if(st)inn.striker=st;if(ns)inn.nonStriker=ns;if(bw)inn.bowler=bw;persist("matches/"+M.id,M);render();};

  pad.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>extraDialog(m,b.dataset.e));
  pad.querySelector("[data-wk]").onclick=()=>wicketDialog(m);

    const M=fresh(),inn=curInn(M);inn.closed=true;if(M.innings.length===2){M.status="done";M.result=computeResult(M);}persist("matches/"+M.id,M);render();};
}

      el.querySelector("#rw").style.display=k==="run out"?"":"none";f.out.options[1].disabled=k!=="run out";if(k!=="run out")f.out.selectedIndex=0;};

  });
}

/* ----- tournaments ----- */
function outcome(m){
  if(m.status!=="done")return null;
  if("winner" in m){if(m.winner)return{type:"win",w:m.winner,l:m.winner===m.teamA?m.teamB:m.teamA};return{type:m.draw?"draw":"nr"};}
  if(m.nr||!m.innings||m.innings.length<2)return{type:"nr"};
  const a=calc(m.innings[0]),b=calc(m.innings[1]);
  if(b.runs>a.runs)return{type:"win",w:m.innings[1].bat,l:m.innings[0].bat};
  if(b.runs===a.runs)return{type:"tie"};
  return{type:"win",w:m.innings[0].bat,l:m.innings[1].bat};
}

   ${list("🎯 Most wickets",st.filter(p=>p.w>0).sort((a,b)=>b.w-a.w||a.br-b.br).slice(0,10),p=>p.w,p=>`${ov(p.bb)} ov · econ ${fmt(p.eco)}`)}
   <div class="card" style="margin:0"><h3>💥 Highest scores</h3>${hs.slice(0,10).map((h,i)=>`<div class="lb"><span><span class="rk">${i+1}</span><span class="n link" data-p="${esc(h.id)}">${esc(pn(h.id))}</span> <span class="small muted">vs ${esc(h.vs)}</span></span><span class="v">${h.r}${h.no?"*":""} <span class="small muted">(${h.b})</span></span></div>`).join("")||'<div class="small muted">Not enough data yet</div>'}</div>
   ${list("⚡ Best strike rate (min 30 balls)",st.filter(p=>p.b>=30).sort((a,b)=>b.sr-a.sr).slice(0,10),p=>fmt(p.sr,1),p=>`${p.r} runs`)}
   ${list("🔒 Best economy (min 4 overs)",st.filter(p=>p.bb>=24).sort((a,b)=>a.eco-b.eco).slice(0,10),p=>fmt(p.eco),p=>`${ov(p.bb)} ov`)}
   ${list("🚀 Most sixes",st.filter(p=>p.s>0).sort((a,b)=>b.s-a.s).slice(0,10),p=>p.s,p=>`${p.r} runs`)}
  </div>
  <div class="row" style="margin-top:14px"><button class="btn g" id="cp">Copy top 10 run-scorers for Instagram</button></div>`;
  bindFilter("lf");bindP(app);
  $("#cp").onclick=async()=>{const top=st.filter(p=>p.r>0).sort((a,b)=>b.r-a.r).slice(0,10);
    const txt=`🏏 J&K top run-scorers${S.lbF.t?" – "+S.lbF.t:""}${S.lbF.s?" "+S.lbF.s:""}\n\n`+top.map((p,i)=>`${i+1}. ${pn(p.id)} – ${p.r} runs (${p.inn} inns, HS ${p.hs}${p.hsNo?"*":""})`).join("\n")+"\n\n#JKCricket #cricinsiderjk";
    try{await navigator.clipboard.writeText(txt);toast("Copied");}catch(e){toast("Couldn't copy");}};
}
function vPlayers(app){
  const st=stats(S.lbF);
  const q=(S.pq||"").toLowerCase();
  const ps=Object.values(S.players).filter(p=>!(S.teams[p.teamId]||{}).local).filter(p=>!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q))
    .map(p=>({...p,s:st[p.id]||{m:0,inn:0,r:0,hs:0,avg:null,sr:null,w:0,eco:null}})).sort((a,b)=>b.s.r-a.s.r||b.s.w-a.s.w||a.name.localeCompare(b.name));
  app.innerHTML=`<div class="sec dom">BCCI domestic</div><h2 style="margin-bottom:4px">Season stats</h2>
   <p class="small muted" style="margin:0 0 14px">J&amp;K players in Ranji Trophy, Syed Mushtaq Ali, Vijay Hazare, Irani Cup &amp; other BCCI tournaments. Local club stats are under <a href="#local">Local club cricket → Player of the Month</a>.</p>${filterBar("pf")}
   <input id="pq" placeholder="Search player or team…" value="${esc(S.pq||"")}" style="margin-bottom:12px">
   <div class="card scroll"><table><thead><tr><th class="l">Player</th><th>M</th><th>Inns</th><th>Runs</th><th>HS</th><th>Avg</th><th>SR</th><th>Wkts</th><th>Econ</th></tr></thead><tbody>
   ${ps.map(p=>`<tr><td class="l"><span class="link" data-p="${esc(p.id)}" style="font-weight:600">${esc(p.name)}</span><div class="small muted">${esc(p.team)} · ${esc(p.role||"")}</div></td><td>${p.s.m}</td><td>${p.s.inn}</td><td><b>${p.s.r}</b></td><td>${p.s.hs}${p.s.hsNo?"*":""}</td><td>${fmt(p.s.avg)}</td><td>${fmt(p.s.sr,1)}</td><td><b>${p.s.w}</b></td><td>${fmt(p.s.eco)}</td></tr>`).join("")||'<tr><td colspan="9" class="empty">No players yet</td></tr>'}
   </tbody></table></div>`;
  bindFilter("pf");bindP(app);
  const pq=$("#pq");pq.oninput=()=>{S.pq=pq.value;const pos=pq.selectionStart;render();const n=$("#pq");n.focus();n.setSelectionRange(pos,pos);};
}
function openPlayer(id){
  const p=S.players[id];const s=stats({local:!!(p&&S.teams[p.teamId]&&S.teams[p.teamId].local)})[id]||{m:0,inn:0,no:0,r:0,b:0,f:0,s:0,hs:0,c50:0,c100:0,bb:0,br:0,w:0,bw:-1,bwr:0,log:[]};
  s.avg=s.inn-s.no>0?s.r/(s.inn-s.no):null;s.sr=s.b?s.r*100/s.b:null;s.eco=s.bb?s.br*6/s.bb:null;
  const byM=new Map();for(const l of s.log){const k=l.m.id;if(!byM.has(k))byM.set(k,{m:l.m});const e=byM.get(k);e[l.type]=e[l.type]?[...e[l.type],l]:[l];}
  const rows=[...byM.values()].sort((a,b)=>(b.m.date||"").localeCompare(a.m.date||""));
  const tile=(k,v,n)=>`<div class="card" style="margin:0;background:var(--bg)"><div class="small muted">${k}</div><div style="font-size:24px;font-weight:800">${v}</div><div class="small muted">${n}</div></div>`;
  openModal(`<div class="row sp"><div><h2 style="margin:0;font-size:22px">${esc(p?p.name:"Player")}</h2><div class="small muted">${esc(p?p.team:"")} · ${esc(p&&p.role||"")}</div></div><button class="btn g sm" id="cx">Close</button></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:14px">
    ${tile("Runs",s.r,`${s.inn} inns · ${s.m} matches`)}${tile("Average",fmt(s.avg),`SR ${fmt(s.sr,1)}`)}${tile("Best",`${s.hs}${s.hsNo?"*":""}`,`${s.c100}×100 · ${s.c50}×50`)}
    ${tile("Wickets",s.w,`${ov(s.bb)} overs`)}${tile("Economy",fmt(s.eco),`Best ${s.bw>=0?s.bw+"/"+s.bwr:"–"}`)}${tile("Boundaries",`${s.f}/${s.s}`,"4s / 6s")}
   </div>
   <h3 style="margin-top:16px">Match by match</h3>
   <div class="scroll"><table><thead><tr><th class="l">Match</th><th>Bat</th><th>Bowl</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td class="l"><span class="link" data-go="match-${esc(r.m.id)}">${esc(tsn(r.m.teamA))} v ${esc(tsn(r.m.teamB))}</span><div class="small muted">${esc(r.m.tournament)} · ${fdate(r.m.date)}</div></td>
     <td>${r.bat?r.bat.map(b=>`<b>${b.r}${b.no?"*":""}</b> <span class="muted small">(${b.b})</span>`).join(", "):"–"}</td>
     <td>${r.bowl?r.bowl.map(b=>b.unk?`<b>${b.w} wkt${b.w===1?"":"s"}</b>`:`<b>${b.w}/${b.r}</b> <span class="muted small">(${ov(b.balls)})</span>`).join(", "):"–"}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">No matches yet</td></tr>'}
   </tbody></table></div>`,el=>{el.querySelector("#cx").onclick=closeModal;el.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>{closeModal();location.hash=a.dataset.go;});});
}

function softRender(){
  const a=document.activeElement;
  if(route().v==="newmatch"&&S.loaded.teams&&S.loaded.matches&&$("#mf"))return;
  if(a&&$("#app").contains(a)&&(a.tagName==="INPUT"||a.tagName==="SELECT")&&a.id!=="pq")return;
  if($("#modal").classList.contains("on")&&a&&a.tagName==="INPUT")return;
  render();
}
AUTH.onChange(()=>{const r=route().v;if(["local","team","match","newmatch"].includes(r))softRender();});
/* ---------- boot ---------- */
render();
(async()=>{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(user){try{S.canEdit=(await user.canEdit())===true;}catch(e){}}
  if(!db){S.err="Scores could not be loaded. Please refresh.";render();return;}
  S.db=db;
  const timer=setTimeout(()=>{if(!S.loaded.teams||!S.loaded.matches){S.err="Scores can't be reached yet. They'll appear when the connection returns.";render();}},10000);
  const done=()=>{if(S.loaded.teams&&S.loaded.matches){clearTimeout(timer);if(S.err.startsWith("Scores can't"))S.err="";}};
  const clone=d=>{const x=JSON.parse(JSON.stringify(d.data()||{}));x.id=d.id;return x;};
  db.collection("teams").onSnapshot(snap=>{S.teams={};snap.docs.forEach(d=>{const t=clone(d);if(t.name)S.teams[t.id]={players:[],...t};});rebuildPlayers();S.loaded.teams=true;done();softRender();},
    ()=>{S.err="Teams are unavailable right now.";render();});
  db.collection("matches").onSnapshot(snap=>{S.matches={};snap.docs.forEach(d=>{const m=clone(d);if(m.innings)S.matches[m.id]=m;});S.loaded.matches=true;done();softRender();},
    ()=>{S.err="Matches are unavailable right now.";render();});
})();
})();
</script>
</body>
</html>
